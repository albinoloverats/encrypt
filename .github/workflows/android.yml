name: Android CI

on:
  push:
    branches: [ android ]
  pull_request:
    branches: [ android ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 21
        cache: gradle
    - uses: android-actions/setup-android@v3
    - name: Android SDK
      run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
    - name: Unit tests
      run: ./gradlew :encrypt:testDebugUnitTest
