name: C/C++ CI

on:
  push:
    branches: [ desktop ]
  pull_request:
    branches: [ desktop ]

env:
  CC: gcc

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: gcc:16@sha256:07280eb2e744f1b7a2d8d4a3894c089ea07266c109758afc388a634bd098e4eb
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4
    - name: dependencies
      run: apt-get update && apt-get install -y build-essential git gcovr=7.2+really-1.1 libgcrypt20 libgcrypt20-dev liblzma5 liblzma-dev libcurl4-gnutls-dev libcmocka-dev
    - name: submodules
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE" && git submodule update --init
    - name: unit-tests-and-coverage
      run: make coverage
    - name: coverage-report
      uses: actions/upload-artifact@v4
      with:
        name: c-coverage-report
        path: coverage/
    - name: self-test
      run: cp etc/encryptrc ~/.encryptrc && ./encrypt --self-test
  publish-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/desktop'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: download-coverage
      uses: actions/download-artifact@v4
      with:
        name: c-coverage-report
        path: coverage
    - name: checkout-pages
      uses: actions/checkout@v4
      with:
        ref: gh-pages
        path: gh-pages
    - name: publish-coverage
      run: |
        git -C gh-pages rm -r -- .
        cp -R coverage/. gh-pages/
        git -C gh-pages config user.name "github-actions[bot]"
        git -C gh-pages config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git -C gh-pages add -A
        if ! git -C gh-pages diff --cached --quiet; then
          git -C gh-pages commit -m "Publish coverage report"
          git -C gh-pages push origin gh-pages
        fi
        echo "Coverage report: https://albinoloverats.github.io/encrypt/" >> "$GITHUB_STEP_SUMMARY"
