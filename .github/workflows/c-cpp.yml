name: C/C++ CI

on:
  push:
    branches: [ desktop ]
  pull_request:
    branches: [ desktop ]

env:
  CC: gcc-14

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - name: dependencies
      run: sudo apt-get update && sudo apt-get install -y gcc-14 build-essential gcovr libgcrypt20 libgcrypt20-dev liblzma5 liblzma-dev libcurl3-gnutls libcurl4-gnutls-dev libcmocka-dev
    - name: submodules
      run: git submodule update --init
    - name: unit-tests-and-coverage
      run: make coverage
    - name: coverage-report
      uses: actions/upload-artifact@v4
      with:
        name: c-coverage-report
        path: coverage/
    - name: self-test
      run: cp etc/encryptrc ~/.encryptrc && ./encrypt --self-test
