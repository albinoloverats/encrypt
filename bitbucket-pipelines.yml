image: gcc:16@sha256:07280eb2e744f1b7a2d8d4a3894c089ea07266c109758afc388a634bd098e4eb

pipelines:
  default:
    - step:
        name: Build and Test
        script:
          - apt-get update && apt-get install -y build-essential cmake git gcovr=7.2+really-1.1 libgcrypt20 libgcrypt20-dev liblzma5 liblzma-dev libcurl4-gnutls-dev libcmocka-dev
          - git submodule update --init
          - cmake -S . -B build -DBUILD_GUI=OFF -DBUILD_TESTS=ON -DENABLE_COVERAGE=ON
          - mkdir -p test-reports
          - CMOCKA_XML_DIR=../test-reports cmake --build build --target coverage --parallel
          - (cd build && sh ../test/test_cli_compressed_eof.sh)
          - cp etc/encryptrc ~/.encryptrc
          - ./build/encrypt --self-test
        artifacts:
          - build/coverage/**
          - test-reports/**
