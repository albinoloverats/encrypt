image: gcc:16@sha256:07280eb2e744f1b7a2d8d4a3894c089ea07266c109758afc388a634bd098e4eb

variables:
  CC: gcc

stages:
  - build
  - test
  - deploy

build:
  stage: build
  before_script:
    - apt-get update && apt-get install -y build-essential cmake git gcovr=7.2+really-1.1 libgcrypt20 libgcrypt20-dev liblzma5 liblzma-dev libcurl4-gnutls-dev libcmocka-dev
    - git submodule update --init
  script:
    - cmake -S . -B build -DBUILD_GUI=OFF -DBUILD_TESTS=ON -DENABLE_COVERAGE=ON
    - cmake --build build --target coverage --parallel
    - (cd build && sh ../test/test_cli_compressed_eof.sh)
  coverage: '/lines: ([0-9]+\\.[0-9]+)%/'
  artifacts:
    paths:
      - build/encrypt
      - build/coverage/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: build/coverage/coverage.xml

# Run the self-test using the binary built above.
test:
  stage: test
  dependencies:
    - build
  before_script:
    - apt-get update && apt-get install -y libgcrypt20 liblzma5 libcurl4-gnutls3
  script:
    - cp etc/encryptrc ~/.encryptrc
    - ./build/encrypt --self-test

pages:
  stage: deploy
  needs:
    - job: build
      artifacts: true
    - job: test
      artifacts: false
  script:
    - mkdir -p public
    - cp -R build/coverage/. public/
  pages:
    publish: public
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
