image: gcc

build:
  stage: build
  before_script:
    - apt-get update && apt-get install -y gcovr libgcrypt20 libgcrypt20-dev liblzma5 liblzma-dev libcurl3-gnutls libcurl4-gnutls-dev libcmocka-dev
    - git submodule update --init
  script:
    - make coverage
  coverage: '/lines: ([0-9]+\.[0-9]+)%/'
  artifacts:
    paths:
      - encrypt
      - coverage/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/coverage.xml

# run tests using the binary built before
test:
  stage: test
  dependencies:
    - build
  before_script:
    - apt-get update && apt-get install -y libgcrypt20 libgcrypt20-dev liblzma5 liblzma-dev libcurl3-gnutls libcurl4-gnutls-dev libcmocka-dev
  script:
    - cp etc/encryptrc ~/.encryptrc
    - ./encrypt --self-test

pages:
  stage: deploy
  needs:
    - job: build
      artifacts: true
    - job: test
      artifacts: false
  script:
    - mkdir -p public
    - cp -R coverage/. public/
  pages:
    publish: public
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
